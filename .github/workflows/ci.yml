name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest
      - name: build ingestion image
        run: docker build -f ingestion/Dockerfile -t oss-pulse-ingestion .

  dbt:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-bigquery
      # TODO: configure GCP auth (Workload Identity Federation recommended)
      - run: dbt deps && dbt build --target ci
        working-directory: dbt/oss_pulse

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt + validate (no credentials needed)
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
        working-directory: terraform
      # Plan needs GCP auth + remote state. Enable by setting repo variable TF_PLAN_ENABLED=true
      # once Workload Identity Federation is configured (TODO: add google-github-actions/auth step).
      - name: plan
        if: vars.TF_PLAN_ENABLED == 'true'
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=oss-pulse/dev"
          terraform plan -input=false -lock=false \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" -var="bucket_name=${{ vars.GCS_BUCKET }}"
        working-directory: terraform
