name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4 # Spark tests need a JVM
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest
      - name: build ingestion image
        run: docker build -f ingestion/Dockerfile -t oss-pulse-ingestion .

  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build Airflow image
        run: docker build -f airflow/Dockerfile -t oss-pulse-airflow:ci .
      # Import every DAG in the real image (no metadata DB, no GCP). PYTHONPATH mirrors what
      # Airflow does for the dags/ folder; config values are placeholders.
      - name: DAGs import without errors
        run: |
          docker run --rm --entrypoint python \
            -e PYTHONPATH=/opt/airflow/dags \
            -e GCP_PROJECT_ID=ci-placeholder -e GCP_REGION=us-central1 -e GCS_BUCKET=ci-placeholder \
            -v "$PWD/airflow/dags:/opt/airflow/dags:ro" oss-pulse-airflow:ci -c "
          from airflow.dag_processing.dagbag import DagBag
          bag = DagBag('/opt/airflow/dags')
          assert not bag.import_errors, bag.import_errors
          assert 'oss_pulse_daily' in bag.dags, sorted(bag.dags)
          print('DAGs OK:', sorted(bag.dags))
          "

  dbt:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r dbt/requirements.txt
      # Static checks, no GCP credentials needed: Jinja, refs, YAML, tests and unit-test definitions.
      - name: dbt deps + parse
        env:
          GCP_PROJECT_ID: ci-placeholder
          DBT_TARGET: ci
        run: |
          dbt deps --project-dir dbt/oss_pulse --profiles-dir dbt/oss_pulse
          dbt parse --project-dir dbt/oss_pulse --profiles-dir dbt/oss_pulse
      # TODO (orchestration step): with Workload Identity Federation, run
      #   dbt build --target ci --empty   (schema-only build + unit tests in oss_pulse_ci)

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt + validate (no credentials needed)
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
        working-directory: terraform
      # Plan needs GCP auth + remote state. Enable by setting repo variable TF_PLAN_ENABLED=true
      # once Workload Identity Federation is configured (TODO: add google-github-actions/auth step).
      - name: plan
        if: vars.TF_PLAN_ENABLED == 'true'
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=oss-pulse/dev"
          terraform plan -input=false -lock=false \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" -var="bucket_name=${{ vars.GCS_BUCKET }}"
        working-directory: terraform
