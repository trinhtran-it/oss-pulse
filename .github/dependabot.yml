# Weekly PRs that bump pinned versions; each one goes through CI like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories: [/, /ingestion, /spark, /dbt]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
