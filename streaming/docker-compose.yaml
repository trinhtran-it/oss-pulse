# Streaming stretch goal: Wikimedia EventStreams -> Redpanda -> Flink SQL -> Postgres -> Grafana.
# Start with `make stream-up`, stop with `make stream-down`. Everything listens on 127.0.0.1 only.
#
#   Grafana (live tile)  http://localhost:3000   (anonymous, read-only)
#   Flink UI             http://localhost:8082
#   Redpanda Console     http://localhost:8083
#   Kafka (host)         127.0.0.1:19092          Postgres (host)  127.0.0.1:5433
#
# Memory: ~3 GB in total, so it runs next to the Airflow stack on an 8 GB Docker VM.
name: oss-pulse-streaming

x-flink-config: &flink-config
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: jobmanager
    rest.address: jobmanager
    taskmanager.numberOfTaskSlots: 2
    state.backend.type: hashmap
    execution.checkpointing.dir: file:///flink/checkpoints
    execution.checkpointing.num-retained: 2
    jobmanager.memory.process.size: 1024m
    taskmanager.memory.process.size: 1536m

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.3.1
    command:
      - redpanda
      - start
      - --mode=dev-container # single node, relaxed fsync: fine for a demo, not for production
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092 # not "localhost": it may resolve to ::1
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot: create the topic (3 partitions, keyed by wiki, 24 h retention). Idempotent.
  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.3.1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        rpk topic create wiki.recentchange -X brokers=redpanda:9092 -p 3 -r 1
        -c retention.ms=86400000 -c cleanup.policy=delete
        || rpk topic describe wiki.recentchange -X brokers=redpanda:9092
    depends_on:
      redpanda: { condition: service_healthy }
    restart: "no"

  console:
    image: docker.redpanda.com/redpandadata/console:v3.15.0
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      redpanda: { condition: service_healthy }
    restart: unless-stopped

  producer:
    build: { context: .., dockerfile: streaming/producer/Dockerfile }
    image: oss-pulse-wiki-producer:0.1
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_TOPIC: wiki.recentchange
      STATE_FILE: /state/last_event_id
      EDITOR_HASH_SALT: ${STREAM_EDITOR_HASH_SALT:-oss-pulse}
      STREAM_USER_AGENT: ${STREAM_USER_AGENT:-oss-pulse-streaming/0.1 (data engineering demo)}
    volumes:
      - producer-state:/state
    depends_on:
      topic-init: { condition: service_completed_successfully }
    mem_limit: 256m
    restart: unless-stopped

  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: streaming
      POSTGRES_USER: ${STREAM_PG_USER:-flink}
      POSTGRES_PASSWORD: ${STREAM_PG_PASSWORD:-flink}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d streaming"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot: Flink runs as user "flink", but a new named volume is owned by root.
  checkpoint-init:
    image: oss-pulse-flink:2.2.1
    user: root
    entrypoint: ["chown", "-R", "flink:flink", "/flink/checkpoints"]
    volumes:
      - flink-checkpoints:/flink/checkpoints
    restart: "no"

  jobmanager:
    build: { context: .., dockerfile: streaming/flink/Dockerfile }
    image: oss-pulse-flink:2.2.1
    command: jobmanager
    environment: *flink-config
    ports:
      - "127.0.0.1:8082:8081"
    volumes:
      - flink-checkpoints:/flink/checkpoints
    depends_on:
      checkpoint-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  taskmanager:
    image: oss-pulse-flink:2.2.1
    command: taskmanager
    environment: *flink-config
    volumes:
      - flink-checkpoints:/flink/checkpoints
    depends_on:
      jobmanager: { condition: service_healthy }
    restart: unless-stopped

  # One-shot: submit the SQL job (skips if it is already running; resumes from a checkpoint).
  job-submit:
    image: oss-pulse-flink:2.2.1
    # Through the image's entrypoint, which writes FLINK_PROPERTIES (rest.address) into the config.
    command: ["/opt/submit-job.sh"]
    environment:
      <<: *flink-config
      PG_USER: ${STREAM_PG_USER:-flink}
      PG_PASSWORD: ${STREAM_PG_PASSWORD:-flink}
    volumes:
      - flink-checkpoints:/flink/checkpoints
    depends_on:
      jobmanager: { condition: service_healthy }
      taskmanager: { condition: service_started }
      postgres: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
    restart: "no"

  grafana:
    image: grafana/grafana:13.3.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wiki_edits_live.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  redpanda-data:
  producer-state:
  postgres-data:
  flink-checkpoints:
