[project]
name = "oss-pulse"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt/oss_pulse/dbt_packages", "dbt/oss_pulse/target", "dbt/oss_pulse/logs", "terraform", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["airflow"]  # not the local airflow/ folder

[tool.ruff.lint.per-file-ignores]
"ingestion/gharchive.py" = ["B904"]  # argparse/config errors intentionally re-raised with a clean message

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "spark/tests", "airflow/tests", "streaming/tests"]
pythonpath = ["airflow/dags"]  # import oss_pulse_lib like Airflow does
addopts = "-q"
