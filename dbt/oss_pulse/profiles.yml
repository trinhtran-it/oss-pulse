# dbt connection profiles. Committed on purpose: every value comes from env_var(), no secrets.
# Auth is OAuth via Application Default Credentials (`gcloud auth application-default login`).
# Use with --profiles-dir dbt/oss_pulse (the Makefile does this).
#
#   dev  -> your own dataset (DBT_DEV_DATASET, e.g. dbt_<yourname>); dbt creates it if missing
#   prod -> Terraform-managed oss_pulse_staging / oss_pulse_marts
#   ci   -> oss_pulse_ci
oss_pulse:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('DBT_DEV_DATASET', 'dbt_dev') }}"
      location: "{{ env_var('GCP_REGION', 'asia-southeast1') }}"
      threads: 4
      job_execution_timeout_seconds: 600
      job_retries: 1
      maximum_bytes_billed: 10000000000 # 10 GB per query: fail instead of overspending

    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_DATASET_MARTS', 'oss_pulse_marts') }}"
      location: "{{ env_var('GCP_REGION', 'asia-southeast1') }}"
      threads: 4
      job_execution_timeout_seconds: 600
      job_retries: 1
      maximum_bytes_billed: 10000000000

    ci:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: oss_pulse_ci # Terraform-managed; tables expire after 1 day
      location: "{{ env_var('GCP_REGION', 'asia-southeast1') }}"
      threads: 4
      job_execution_timeout_seconds: 600
      job_retries: 1
      maximum_bytes_billed: 2000000000 # 2 GB: CI builds 2 days (~0.5 GB per model); more = a bug
