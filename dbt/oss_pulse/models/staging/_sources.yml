version: 2

sources:
  - name: raw
    description: Landing tables in BigQuery, loaded by warehouse/load_events.sh.
    schema: "{{ env_var('BQ_DATASET_RAW', 'oss_pulse_raw') }}"
    tables:
      - name: events
        description: >
          One row per GH Archive event, partitioned by DATE(created_at) with
          require_partition_filter = TRUE: every query must filter on created_at.
        config:
          loaded_at_field: created_at
          freshness:
            warn_after: { count: 26, period: hour }
            error_after: { count: 50, period: hour }
            # The partition filter keeps the freshness query cheap (and allowed).
            filter: "created_at >= timestamp_sub(current_timestamp(), interval 3 day)"
