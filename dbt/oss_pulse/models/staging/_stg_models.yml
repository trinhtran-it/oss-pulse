version: 2

models:
  - name: stg_events
    description: >
      raw.events, one row per event, renamed, typed and lowercased (logins, repo names, actions).
      payload_json is excluded. Queries must filter created_at (partition filter required).
    columns:
      - name: event_id
        description: GitHub event id (string).
        data_tests:
          - unique:
              config:
                where: "created_at >= timestamp('{{ var('history_start_date') }}')"
          - not_null:
              config:
                where: "created_at >= timestamp('{{ var('history_start_date') }}')"
      - name: event_type
        data_tests:
          - not_null:
              config:
                where: "created_at >= timestamp('{{ var('history_start_date') }}')"
      - name: created_at
        description: Event time, UTC.

  - name: stg_github_repos
    description: >
      One row per enriched repository: the latest GitHub API answer from raw.github_repo_metadata.
      Metadata from the latest successful call; last_status / last_checked_at from the latest call.
    columns:
      - name: repo_id
        data_tests: [unique, not_null]
      - name: last_status
        description: Status of the latest call (ok, not_modified, not_found, blocked).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ok, not_modified, not_found, blocked]
